[project]
name = "darwin-logger"
version = "0.1.0"
description = "Zero-dependency structured logging for Darwin CLI and data tools"
readme = "README.md"
authors = [
    { name = "Hong", email = "sardineclub@126.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
color = ["colorama>=0.4"]
all = ["colorama>=0.4", "pytest>=7.0"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
